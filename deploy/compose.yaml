# dragonfly (Redis-compatible server) <- chaosproxy <- tester
#
#   docker compose -f deploy/compose.yaml up -d --build dragonfly chaosproxy
#   docker compose -f deploy/compose.yaml run --rm tester
#   docker compose -f deploy/compose.yaml exec chaosproxy chaosproxy ctl conns
name: chaosproxy-e2e

services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    command: ["--proactor_threads=2", "--maxmemory=512mb"]
    ulimits:
      memlock: -1

  chaosproxy:
    image: chaosproxy:dev
    build: ..
    command:
      - --upstream=dragonfly:6379
      - --listen=0.0.0.0:6379
      - --control=0.0.0.0:9100
      - --workers=4
      - --stats=10
    depends_on: [dragonfly]

  tester:
    image: python:3.12-slim
    volumes: ["./test:/test:ro"]
    entrypoint: ["python3", "-u", "/test/chaos_check.py", "--proxy=chaosproxy:6379", "--direct=dragonfly:6379", "--control=chaosproxy:9100"]
    depends_on: [chaosproxy]
    profiles: ["test"]
